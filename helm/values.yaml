# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
replicaCount: 1
image:
  repository: ghcr.io/vldmrhlushko/kbot
  tag: v1.0.0-otel-amd64
secret:
  name: "kbot"
  env: "TELE_TOKEN"
  key: "token"
securityContext:
  privileged: true
env:
  - name: METRICS_HOST
    value: "otel-collector:4317"
